<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cuenta dé Tomito Clicker</title>
  <link rel="icon" href="logosite/logosite.png" type="image/png"/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      background: #0d0020;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0d0020, #1a003a, #0d0020, #2a0050, #0d0020);
      background-size: 400% 400%;
      animation: bgShift 12s ease infinite;
      z-index: -1;
    }

    @keyframes bgShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      z-index: -1;
      pointer-events: none;
    }

    #card {
      background: rgba(10,2,24,0.95);
      border: 1px solid rgba(124,58,237,0.4);
      border-radius: 24px;
      padding: 40px 36px 36px;
      width: min(420px, 94vw);
      box-shadow: 0 0 80px rgba(124,58,237,0.2);
      animation: cardIn 0.5s cubic-bezier(0.22,1,0.36,1);
    }

    @keyframes cardIn {
      0%   { opacity: 0; transform: translateY(30px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    #logo {
      display: block;
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 50%;
      margin: 0 auto 16px;
      border: 3px solid rgba(168,85,247,0.6);
      box-shadow: 0 0 20px rgba(168,85,247,0.4);
    }

    h1 {
      font-family: 'Cinzel Decorative', cursive;
      font-size: clamp(1rem, 3vw, 1.4rem);
      text-align: center;
      background: linear-gradient(90deg, #c084fc, #f0abfc, #818cf8, #c084fc);
      background-size: 300% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 4s linear infinite;
      margin-bottom: 6px;
    }

    @keyframes shimmer {
      0%   { background-position: 0% center; }
      100% { background-position: 300% center; }
    }

    .subtitle {
      text-align: center;
      font-size: 0.78rem;
      color: #7c6fa0;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    /* Tabs */
    #tabs {
      display: flex;
      gap: 0;
      margin-bottom: 24px;
      background: rgba(30,10,60,0.5);
      border-radius: 12px;
      padding: 4px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      background: none;
      border: none;
      border-radius: 9px;
      color: #7c6fa0;
      font-family: 'Nunito', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: rgba(124,58,237,0.4);
      color: #e9d5ff;
      box-shadow: 0 0 10px rgba(124,58,237,0.3);
    }

    /* Form */
    .form { display: none; flex-direction: column; gap: 14px; }
    .form.active { display: flex; }

    .input-wrap { position: relative; }

    .input-wrap input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(30,10,60,0.7);
      border: 1px solid rgba(124,58,237,0.35);
      border-radius: 12px;
      color: #e9d5ff;
      font-family: 'Nunito', sans-serif;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrap input:focus {
      border-color: #a855f7;
      box-shadow: 0 0 0 3px rgba(168,85,247,0.15);
    }

    .input-wrap input::placeholder { color: #4a3a6a; }

    .submit-btn {
      padding: 13px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: 'Cinzel Decorative', cursive;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      transition: transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 0 20px rgba(168,85,247,0.3);
      margin-top: 4px;
    }

    .submit-btn:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(168,85,247,0.5); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    #error-msg {
      text-align: center;
      font-size: 0.82rem;
      color: #f87171;
      min-height: 20px;
      margin-top: -4px;
    }

    #success-msg {
      text-align: center;
      font-size: 0.82rem;
      color: #86efac;
      min-height: 20px;
      margin-top: -4px;
    }

    .rules {
      font-size: 0.72rem;
      color: #4a3a6a;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="orb" style="width:500px;height:500px;background:#7c3aed;top:-100px;left:-150px;"></div>
  <div class="orb" style="width:400px;height:400px;background:#a855f7;bottom:-80px;right:-100px;"></div>

  <div id="card">
    <img id="logo" src="logosite/logosite.png" alt="Logo"/>
    <h1>Cuenta dé Tomito Clicker</h1>
    <p class="subtitle">✦ Connecte-toi pour jouer ✦</p>

    <div id="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Connexion</button>
      <button class="tab-btn" onclick="switchTab('register')">Inscription</button>
    </div>

    <!-- CONNEXION -->
    <div class="form active" id="form-login">
      <div class="input-wrap">
        <input type="text" id="login-username" placeholder="Pseudo" maxlength="20" autocomplete="username"/>
      </div>
      <div class="input-wrap">
        <input type="password" id="login-password" placeholder="Mot de passe" autocomplete="current-password"/>
      </div>
      <div id="error-msg"></div>
      <button class="submit-btn" id="login-btn" onclick="login()">Se connecter</button>
    </div>

    <!-- INSCRIPTION -->
    <div class="form" id="form-register">
      <div class="input-wrap">
        <input type="text" id="reg-username" placeholder="Pseudo (3-20 caractères)" maxlength="20"/>
      </div>
      <div class="input-wrap">
        <input type="password" id="reg-password" placeholder="Mot de passe (min. 6 caractères)" autocomplete="new-password"/>
      </div>
      <div class="input-wrap">
        <input type="password" id="reg-confirm" placeholder="Confirmer le mot de passe" autocomplete="new-password"/>
      </div>
      <div id="success-msg"></div>
      <div id="error-msg-reg"></div>
      <button class="submit-btn" id="reg-btn" onclick="register()">Créer mon compte</button>
      <p class="rules">En créant un compte tu acceptes de jouer fair-play.<br>Pas d'autoclick, pas de triche.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://hfdbeiduutgxbbgryozh.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmZGJlaWR1dXRneGJiZ3J5b3poIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3OTgwOTcsImV4cCI6MjA5MDM3NDA5N30.P4aYHCN98H9CQUriRbtdqUgaVPau03H8uxyTz1nf2HA";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Si déjà connecté, rediriger vers le jeu
    sb.auth.getSession().then(({ data }) => {
      if (data.session) window.location.href = "index.html";
    });

    function switchTab(tab) {
      document.querySelectorAll(".tab-btn").forEach((b,i) => b.classList.toggle("active", (i===0&&tab==="login")||(i===1&&tab==="register")));
      document.getElementById("form-login").classList.toggle("active", tab === "login");
      document.getElementById("form-register").classList.toggle("active", tab === "register");
      document.getElementById("error-msg").textContent = "";
      document.getElementById("error-msg-reg").textContent = "";
      document.getElementById("success-msg").textContent = "";
    }

    async function login() {
      const username = document.getElementById("login-username").value.trim();
      const password = document.getElementById("login-password").value;
      const errEl = document.getElementById("error-msg");
      const btn = document.getElementById("login-btn");

      if (!username || !password) { errEl.textContent = "Remplis tous les champs."; return; }

      btn.disabled = true;
      btn.textContent = "Connexion...";
      errEl.textContent = "";

      // On utilise username@cuentatito.game comme email fictif
      const email = username.toLowerCase().replace(/[^a-z0-9]/g, '') + "@cuentatito.game";
      const { error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        errEl.textContent = "Pseudo ou mot de passe incorrect.";
        btn.disabled = false;
        btn.textContent = "Se connecter";
      } else {
        window.location.href = "index.html";
      }
    }

    async function register() {
      const username = document.getElementById("reg-username").value.trim();
      const password = document.getElementById("reg-password").value;
      const confirm  = document.getElementById("reg-confirm").value;
      const errEl    = document.getElementById("error-msg-reg");
      const succEl   = document.getElementById("success-msg");
      const btn      = document.getElementById("reg-btn");

      errEl.textContent = "";
      succEl.textContent = "";

      if (!username || !password || !confirm) { errEl.textContent = "Remplis tous les champs."; return; }
      if (username.length < 3) { errEl.textContent = "Pseudo trop court (min. 3 caractères)."; return; }
      if (password.length < 6) { errEl.textContent = "Mot de passe trop court (min. 6 caractères)."; return; }
      if (password !== confirm) { errEl.textContent = "Les mots de passe ne correspondent pas."; return; }
      if (!/^[a-zA-Z0-9_]+$/.test(username)) { errEl.textContent = "Pseudo : lettres, chiffres et _ uniquement."; return; }

      btn.disabled = true;
      btn.textContent = "Création...";

      // Vérifier si le pseudo est déjà pris
      const { data: existing } = await sb.from("profiles").select("id").eq("username", username).single();
      if (existing) {
        errEl.textContent = "Ce pseudo est déjà pris.";
        btn.disabled = false;
        btn.textContent = "Créer mon compte";
        return;
      }

      const email = username.toLowerCase().replace(/[^a-z0-9]/g, '') + "@cuentatito.game";
      const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: null } });

      if (error) {
        errEl.textContent = "Erreur : " + error.message;
        btn.disabled = false;
        btn.textContent = "Créer mon compte";
        return;
      }

      // Créer le profil
      await sb.from("profiles").insert({ id: data.user.id, username });

      succEl.textContent = "Compte créé ! Connexion en cours...";
      setTimeout(() => window.location.href = "index.html", 1200);
    }

    // Enter pour valider
    document.addEventListener("keydown", e => {
      if (e.key !== "Enter") return;
      if (document.getElementById("form-login").classList.contains("active")) login();
      else register();
    });
  </script>
</body>
</html>
